# ======================================================================
# Configuracion de order-service
# ======================================================================
quarkus.application.name=order-service
quarkus.http.port=8080

# ----------------------------------------------------------------------
# Logging - MDC (traceId/spanId/parentId/orderId/customerId) visible en
# consola para la demo. El export OTLP hacia Loki ya incluye el MDC como
# atributos del log automaticamente (no requiere este formato).
# ----------------------------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [traceId=%X{traceId},spanId=%X{spanId},parentId=%X{parentId},orderId=%X{orderId},customerId=%X{customerId}] %s%e%n

# ----------------------------------------------------------------------
# Origen de datos (PostgreSQL)
# ----------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# En modo dev y test, Quarkus Dev Services arranca automaticamente un
# contenedor PostgreSQL en Docker, por lo que NO es necesario configurar
# usuario/clave/url. Asegurate de tener Docker en ejecucion.

# En produccion la conexion se toma de variables de entorno.
quarkus.datasource.username=${DB_USERNAME:quarkusdbuser}
quarkus.datasource.password=${DB_PASSWORD:Java360445}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}

# ----------------------------------------------------------------------
# Hibernate ORM
# ----------------------------------------------------------------------
# El esquema lo gestiona Flyway, por eso Hibernate no debe generarlo.
quarkus.hibernate-orm.database.generation=none
# Mostrar el SQL formateado solo en desarrollo (util para depurar).
%dev.quarkus.hibernate-orm.log.sql=true

# ----------------------------------------------------------------------
# Flyway (migraciones de esquema)
# ----------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Por defecto (prod) solo se aplica el esquema en db/migration.
quarkus.flyway.locations=classpath:db/migration
# En dev se agrega ademas la carpeta db/dev con los datos de prueba (seed),
# de modo que esos INSERT nunca lleguen a produccion.
%dev.quarkus.flyway.locations=classpath:db/migration,classpath:db/dev

# ----------------------------------------------------------------------
# REST Client hacia tracking-service (demo CiliumNetworkPolicy)
# Permite demostrar en Hubble que el egress de order-service hacia
# tracking-service esta bloqueado por la politica zero-trust.
# ----------------------------------------------------------------------
quarkus.rest-client.tracking-service.url=${TRACKING_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.tracking-service.connect-timeout=2000
quarkus.rest-client.tracking-service.read-timeout=2000

# ----------------------------------------------------------------------
# Fault injection BD (demo de troubleshooting con tracing) - deshabilitado
# por defecto. Se activa en vivo via env var sin rebuild ni redeploy,
# simulando que PostgreSQL se puso lento.
# ----------------------------------------------------------------------
fault.db.latency.enabled=${FAULT_DB_LATENCY_ENABLED:false}
# Latencia base agregada antes de cada operacion con la base de datos.
fault.db.latency.delay-ms=${FAULT_DB_LATENCY_DELAY_MS:0}
# Jitter aleatorio adicional (0..jitter-ms) para simular variabilidad real.
fault.db.latency.jitter-ms=${FAULT_DB_LATENCY_JITTER_MS:0}

# ----------------------------------------------------------------------
# OpenAPI / Swagger UI
# ----------------------------------------------------------------------
# Swagger UI disponible siempre (incluso en prod) en /q/swagger-ui
quarkus.swagger-ui.always-include=true

# ----------------------------------------------------------------------
# OpenTelemetry (traces + metricas + logs por OTLP hacia el collector)
# ----------------------------------------------------------------------
# El service.name del recurso OTel se toma de quarkus.application.name.
# En Kubernetes, OTEL_EXPORTER_OTLP_ENDPOINT apunta al Service del collector.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
# En dev no hay collector desplegado: se desactiva la exportacion para evitar ruido.
%dev.quarkus.otel.sdk.disabled=true
