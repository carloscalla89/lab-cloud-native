# ======================================================================
# experience-order-tracker-service: BFF / orquestador (sin base de datos).
# Llama a order-service y tracking-service via sus Services internos.
# Imagen local: experience-order-tracker-service:jvm
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experience-order-tracker-service
  namespace: apps
  labels:
    app.kubernetes.io/name: experience-order-tracker-service
    app.kubernetes.io/part-of: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: experience-order-tracker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: experience-order-tracker-service
        app.kubernetes.io/part-of: apps
    spec:
      containers:
        - name: experience-order-tracker-service
          image: experience-order-tracker-service:jvm
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: ORDER_SERVICE_URL
              value: http://order-service.apps.svc.cluster.local:8080
            - name: TRACKING_SERVICE_URL
              value: http://tracking-service.apps.svc.cluster.local:8081
          #envFrom:
            #- configMapRef:
                #name: otel-endpoint
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8082
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8082
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: experience-order-tracker-service
  namespace: apps
  labels:
    app.kubernetes.io/name: experience-order-tracker-service
spec:
  selector:
    app.kubernetes.io/name: experience-order-tracker-service
  ports:
    - port: 8082
      targetPort: 8082
