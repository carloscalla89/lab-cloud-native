# Overlay para GKE / Cloud Service Mesh.
# Reutiliza la base Gateway API (istio/base/) y parchea SOLO lo que difiere del
# entorno kind. El HTTPRoute y las policies de seguridad no se tocan aqui.
#
# Uso:  kubectl kustomize istio/overlays/gcp/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: gateway-class-patch.yaml
