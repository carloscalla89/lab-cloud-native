# ======================================================================
# tracking-service: ACL de geocodificacion + eventos (PostgreSQL db 'tracking').
# Namespace: apps | Puerto: 8081 | Imagen: Docker Hub (carlos89/tracking-service:jvm)
# Proveedor de geocodificacion por defecto: nominatim (sin API key).
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: apps
  labels:
    app.kubernetes.io/name: tracking-service
    app.kubernetes.io/part-of: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-service
        app.kubernetes.io/part-of: apps
    spec:
      serviceAccountName: tracking-service
      containers:
        - name: tracking-service
          image: carlos89/tracking-service:jvm
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://cloudnative-db.databases.svc.cluster.local:5432/tracking
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-apps
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-apps
                  key: POSTGRES_PASSWORD
            - name: GEOCODING_PROVIDER
              value: nominatim
            - name: FAULT_LATENCY_ENABLED
              value: "false"
            - name: FAULT_LATENCY_DELAY_MS
              value: "0"
            - name: FAULT_LATENCY_JITTER_MS
              value: "0"
            # OpenTelemetry: configurado solo en el manifiesto.
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4317
            - name: QUARKUS_OTEL_METRICS_ENABLED
              value: "false"
            - name: QUARKUS_OTEL_LOGS_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8081
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
