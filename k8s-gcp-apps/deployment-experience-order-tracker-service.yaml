# ======================================================================
# experience-order-tracker-service: BFF / orquestador (sin base de datos).
# Namespace: apps | Puerto: 8082 | Imagen: Artifact Registry (GCP)
# Llama a order-service y tracking-service via sus Services internos.
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experience-order-tracker-service
  namespace: apps
  labels:
    app.kubernetes.io/name: experience-order-tracker-service
    app.kubernetes.io/part-of: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: experience-order-tracker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: experience-order-tracker-service
        app.kubernetes.io/part-of: apps
    spec:
      serviceAccountName: experience-order-tracker-service
      containers:
        - name: experience-order-tracker-service
          # TODO(GCP): reemplazar PROJECT_ID por el proyecto real.
          image: us-central1-docker.pkg.dev/PROJECT_ID/lab-cloudnative/experience-order-tracker-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: ORDER_SERVICE_URL
              value: http://order-service.apps.svc.cluster.local:8080
            - name: TRACKING_SERVICE_URL
              value: http://tracking-service.apps.svc.cluster.local:8081
            # OpenTelemetry: configurado solo en el manifiesto.
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4317
            - name: QUARKUS_OTEL_METRICS_ENABLED
              value: "false"
            - name: QUARKUS_OTEL_LOGS_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8082
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8082
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
