# ======================================================================
# order-service: gestion de ordenes (PostgreSQL db 'orders').
# Namespace: apps | Puerto: 8080 | Imagen: Artifact Registry (GCP)
# ======================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: apps
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: apps
    spec:
      serviceAccountName: order-service
      containers:
        - name: order-service
          image: us-central1-docker.pkg.dev/training-lab-504513/lab-cloudnative/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://cloudnative-db.databases.svc.cluster.local:5432/orders
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-apps
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-apps
                  key: POSTGRES_PASSWORD
            # URL usada por el endpoint de demo (GET /orders/{id}/tracking-status).
            - name: TRACKING_SERVICE_URL
              value: http://tracking-service.apps.svc.cluster.local:8081
            # Fault injection de latencia en BD (demo de troubleshooting).
            - name: FAULT_DB_LATENCY_ENABLED
              value: "false"
            - name: FAULT_DB_LATENCY_DELAY_MS
              value: "0"
            - name: FAULT_DB_LATENCY_JITTER_MS
              value: "0"
            # OpenTelemetry: configurado solo en el manifiesto.
            - name: QUARKUS_OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel.svc.cluster.local:4317
            - name: QUARKUS_OTEL_METRICS_ENABLED
              value: "false"
            - name: QUARKUS_OTEL_LOGS_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
