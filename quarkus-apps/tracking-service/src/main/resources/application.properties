# ======================================================================
# Configuracion de tracking-service
# ======================================================================
quarkus.application.name=tracking-service
# Puerto distinto al de order-service (8080) para poder correrlos juntos.
quarkus.http.port=8081

# ----------------------------------------------------------------------
# Logging - MDC (traceId/spanId/parentId/orderId/customerId) visible en
# consola para la demo. El export OTLP hacia Loki ya incluye el MDC como
# atributos del log automaticamente (no requiere este formato).
# ----------------------------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [traceId=%X{traceId},spanId=%X{spanId},parentId=%X{parentId},orderId=%X{orderId},customerId=%X{customerId}] %s%e%n

# ----------------------------------------------------------------------
# Origen de datos (PostgreSQL)
# ----------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# En dev y test, Quarkus Dev Services arranca automaticamente un contenedor
# PostgreSQL en Docker al iniciar la aplicacion. No se define jdbc.url en estos
# perfiles a proposito: si hubiera una URL configurada, Dev Services se
# desactivaria. Requiere Docker en ejecucion.
%dev.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.enabled=true

# En produccion la conexion se toma de variables de entorno.
%prod.quarkus.datasource.username=${DB_USERNAME:quarkusdbuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:Java360445}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tracking}

# ----------------------------------------------------------------------
# Hibernate ORM
# ----------------------------------------------------------------------
# El esquema lo gestiona Flyway, por eso Hibernate no debe generarlo.
quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.log.sql=true

# ----------------------------------------------------------------------
# Flyway (migraciones de esquema)
# ----------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Por defecto (prod) solo se aplica el esquema en db/migration.
quarkus.flyway.locations=classpath:db/migration
# En dev se agrega ademas la carpeta db/dev con los datos de ejemplo, de modo
# que esos INSERT nunca lleguen a produccion.
%dev.quarkus.flyway.locations=classpath:db/migration,classpath:db/dev

# ----------------------------------------------------------------------
# Geocodificacion (frontera del ACL) - seleccion de proveedor
# ----------------------------------------------------------------------
# Proveedor activo: 'nominatim' (gratuito, por defecto) o 'google'.
# Se evalua en tiempo de build (@IfBuildProperty); cambiarlo requiere recompilar.
geocoding.provider=${GEOCODING_PROVIDER:nominatim}

# --- Nominatim / OpenStreetMap (gratuito, sin API key) ---
quarkus.rest-client.nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
quarkus.rest-client.nominatim.connect-timeout=3000
quarkus.rest-client.nominatim.read-timeout=5000

# --- Google Maps (requiere API key; solo si geocoding.provider=google) ---
quarkus.rest-client.google-maps.url=${GOOGLE_MAPS_URL:https://maps.googleapis.com}
quarkus.rest-client.google-maps.connect-timeout=3000
quarkus.rest-client.google-maps.read-timeout=5000
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ----------------------------------------------------------------------
# Fault injection (demo de troubleshooting con tracing) - deshabilitado
# por defecto. Se activa en vivo via env var, sin rebuild ni redeploy
# (kubectl set env / kubectl rollout restart), simulando que el proveedor
# de geocodificacion se puso lento.
# ----------------------------------------------------------------------
fault.latency.enabled=${FAULT_LATENCY_ENABLED:false}
# Latencia base agregada antes de invocar al proveedor de geocodificacion.
fault.latency.delay-ms=${FAULT_LATENCY_DELAY_MS:0}
# Jitter aleatorio adicional (0..jitter-ms) para que la señal en el dashboard
# no se vea perfectamente plana.
fault.latency.jitter-ms=${FAULT_LATENCY_JITTER_MS:0}

# ----------------------------------------------------------------------
# OpenAPI / Swagger UI
# ----------------------------------------------------------------------
quarkus.swagger-ui.always-include=true

# ----------------------------------------------------------------------
# OpenTelemetry (traces + metricas + logs por OTLP hacia el collector)
# ----------------------------------------------------------------------
# El service.name del recurso OTel se toma de quarkus.application.name.
# En Kubernetes, OTEL_EXPORTER_OTLP_ENDPOINT apunta al Service del collector.
# El endpoint, el toggle (sdk.disabled) y metrics/logs se configuran en los
# manifiestos de Kubernetes (variables de entorno del Deployment).
# En dev no hay collector desplegado: se desactiva la exportacion para evitar ruido.
%dev.quarkus.otel.sdk.disabled=true
