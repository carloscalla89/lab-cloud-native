# ======================================================================
# PostgreSQL para los microservicios (instancia 'cloudnative-db').
# Namespace: databases | Imagen: postgres:16 | Persistencia: PVC (1Gi)
# Bases logicas: cloudnative-db (default), orders y tracking.
# ======================================================================
apiVersion: v1
kind: Service
metadata:
  name: cloudnative-db
  namespace: databases
  labels:
    app.kubernetes.io/name: cloudnative-db
    app.kubernetes.io/part-of: apps
spec:
  # Headless: el DNS cloudnative-db.databases.svc.cluster.local resuelve
  # directamente al pod del StatefulSet.
  clusterIP: None
  selector:
    app.kubernetes.io/name: cloudnative-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudnative-db
  namespace: databases
  labels:
    app.kubernetes.io/name: cloudnative-db
    app.kubernetes.io/part-of: apps
spec:
  serviceName: cloudnative-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudnative-db
        app.kubernetes.io/part-of: apps
    spec:
      securityContext:
        # uid del usuario 'postgres' en la imagen oficial; evita problemas de
        # permisos sobre el volumen de local-path en kind.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Subcarpeta dedicada para que initdb no tropiece con lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quarkusdbuser", "-d", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "quarkusdbuser", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
