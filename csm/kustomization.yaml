# Cloud Service Mesh (gestionado) + Gateway API para GKE.
#   kubectl apply -k csm/
# Requiere que el mesh gestionado este ACTIVE (gcloud container fleet mesh ...).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace-istio-ingress.yaml
  - gateway.yaml
  - http-route.yaml
  - peer-authentication.yaml
  - authorization-policies.yaml
