# Unico punto de entrada expuesto por el gateway: el BFF.
# order-service y tracking-service ya no se exponen directamente (solo los llama el BFF).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microservices
  namespace: apps
  labels:
    app.kubernetes.io/part-of: apps
spec:
  parentRefs:
    - name: apps-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /experience
      backendRefs:
        - name: experience-order-tracker-service
          port: 8082
