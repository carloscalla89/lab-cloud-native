# ======================================================================
# Configuracion de experience-order-tracker-service (BFF / orquestador)
# ======================================================================
quarkus.application.name=experience-order-tracker-service
# Puerto distinto al de order-service (8080) y tracking-service (8081).
quarkus.http.port=8082

# Este servicio NO tiene base de datos: solo compone y adapta datos.

# ----------------------------------------------------------------------
# Logging - MDC (traceId/spanId/parentId/orderId/customerId) visible en
# consola para la demo. El export OTLP hacia Loki ya incluye el MDC como
# atributos del log automaticamente (no requiere este formato).
# ----------------------------------------------------------------------
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [traceId=%X{traceId},spanId=%X{spanId},parentId=%X{parentId},orderId=%X{orderId},customerId=%X{customerId}] %s%e%n

# ----------------------------------------------------------------------
# REST Client hacia order-service
# ----------------------------------------------------------------------
quarkus.rest-client.order-service.url=${ORDER_SERVICE_URL:http://localhost:8080}
quarkus.rest-client.order-service.connect-timeout=2000
quarkus.rest-client.order-service.read-timeout=4000

# ----------------------------------------------------------------------
# REST Client hacia tracking-service
# ----------------------------------------------------------------------
quarkus.rest-client.tracking-service.url=${TRACKING_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.tracking-service.connect-timeout=2000
quarkus.rest-client.tracking-service.read-timeout=4000

# ----------------------------------------------------------------------
# OpenAPI / Swagger UI
# ----------------------------------------------------------------------
quarkus.swagger-ui.always-include=true

# ----------------------------------------------------------------------
# OpenTelemetry (traces + metricas + logs por OTLP hacia el collector)
# ----------------------------------------------------------------------
# El service.name del recurso OTel se toma de quarkus.application.name.
# En Kubernetes, OTEL_EXPORTER_OTLP_ENDPOINT apunta al Service del collector.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
# En dev no hay collector desplegado: se desactiva la exportacion para evitar ruido.
%dev.quarkus.otel.sdk.disabled=true
